# Not used by the dbt platform -- it manages its own connection in its own
# UI, and never reads this file. This exists purely for CI (the parse-only
# checks in .github/workflows/dbt-sl-ci.yml need some profile to
# resolve the "snowflake" target) and for anyone running dbt-core locally
# instead of on the platform. Snowflake only. Credentials come from the
# environment, never from here.
jaffle_shop:
  target: snowflake
  outputs:
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'TRANSFORMING') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'ANALYTICS') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'jaffle_shop') }}"
      threads: 4
