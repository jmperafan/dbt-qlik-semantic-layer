models:
  - name: qlik_metric_definitions
    description: >
      Metric definitions for Qlik, generated from the semantic layer. Qlik's load
      script turns every mirrored row into a variable (see bridge/qlik/load_metric_definitions.qvs).
    columns:
      - name: metric_name
        data_tests: [unique, not_null]
      - name: sync_status
        data_tests:
          - accepted_values:
              arguments:
                values: [mirrored, not_mirrored]
