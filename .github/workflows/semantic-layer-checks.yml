# Semantic layer checks on every pull request.
#
# No warehouse needed. dbt parse doesn't connect, and the bridge only reads
# target/. Deploying to Snowflake stays a separate step with real credentials.
#
# The client runs dbt v2, so `checks` parses with v2 and takes the bridge's
# default `--source converter` route (Apache converter on semantic_manifest.json,
# rewrapped to Ossie 0.1.1) -- that's the path that actually ships. `cross-check`
# additionally parses with dbt v1.12, which writes osi_document.json natively, and
# runs `--source dbt-v1` purely to confirm the two independently-built converters
# agree. It isn't required for this client and can be dropped if it gets noisy.

name: semantic-layer-checks

on:
  pull_request:
    paths: ["models/**", "macros/**", "scripts/**", "dbt_project.yml"]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Parse doesn't connect, but profiles.yml still reads these. Adjust to
      # whatever the client's profile expects.
      SNOWFLAKE_ACCOUNT: ci
      SNOWFLAKE_USER: ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10

      - name: Parse with dbt v2, the client's version
        run: dbt parse --target snowflake

      - name: Portability check and the meta rule
        run: python3 scripts/semantic_bridge.py --check

      - name: Snowflake readiness (Ossie 0.1.1 schema, dialects, qualified columns)
        run: uv run scripts/semantic_bridge.py --schema CI.SEMANTIC

  cross-check:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ci
      SNOWFLAKE_USER: ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10

      - name: Parse with dbt v1.12, which writes osi_document.json natively
        run: uvx --from 'dbt-core>=1.12,<1.13' --with dbt-snowflake dbt parse --target snowflake

      - name: Same Snowflake readiness check, via the native route
        run: uv run scripts/semantic_bridge.py --source dbt-v1 --schema CI.SEMANTIC
