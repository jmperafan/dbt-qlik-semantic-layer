# Deploys the semantic layer to Snowflake and Qlik on every merge to main.
#
# The experience this gives contributors: edit the YAML, open a PR
# (dbt-sl-ci.yml gates it), merge. Nothing else by hand.
#
# Unlike dbt-sl-ci.yml, this touches a real warehouse and a real
# Qlik tenant, so it never runs on pull_request -- only push to main, or a
# manual run via workflow_dispatch for testing it before trusting it live.
#
# Repo secrets this needs: SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER,
# SNOWFLAKE_DATABASE, SNOWFLAKE_PRIVATE_KEY (raw PEM, no passphrase today),
# QLIK_TENANT_URL, QLIK_API_KEY, QLIK_APP_ID. Optional: SNOWFLAKE_ROLE /
# SNOWFLAKE_WAREHOUSE, if the account's default role/warehouse aren't right
# for this -- in particular, the grants in "Serve it over MCP" need a role
# with MANAGE GRANTS or ownership, which a plain build role usually isn't.
#
# Confirmed against a real tenant (2026-10-06): build, parse, the
# portability check, generating the deploy SQL, and deploying the semantic
# view all passed end to end. "Serve it over MCP" failed on an expected,
# unrelated permissions gap (see above) before snowflake_admin.py existed;
# the reconcile/Qlik steps were never reached that run and still need a
# fresh dry run against this version.

name: dbt-sl-cd

on:
  push:
    branches: [main]
    paths: ["models/**", "deploy/**", "dbt_project.yml"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dbt v2 (Fusion)
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write Snowflake private key (dbt and snowflake_admin.py both want a file path)
        run: echo "$SNOWFLAKE_PRIVATE_KEY" > "$SNOWFLAKE_PRIVATE_KEY_PATH"
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Build
        run: dbt build --target snowflake

      - name: Parse (so Ossie sources point at Snowflake tables)
        run: dbt parse --target snowflake

      - name: Portability check
        run: python3 deploy/semantic_bridge.py --check

      - name: Build the deploy SQL
        run: uv run deploy/semantic_bridge.py

      - uses: snowflakedb/snowflake-actions@v3

      - name: Deploy the semantic view
        run: snow sql -x -f target/deploy_semantic_views.sql
        env:
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Serve it over MCP
        # continue-on-error: none of this account's roles (TRANSFORMER,
        # METRICS_READER, INSTRUCTOR) have MANAGE GRANTS/ownership on
        # BREAKOUT_LABS, so the grants here fail with a real Snowflake
        # permissions error -- confirmed 2026-10-06, not a bug in this step.
        # Non-blocking so the rest of the pipeline (which doesn't depend on
        # these grants) still runs and gets validated. Remove this once
        # someone with ACCOUNTADMIN/SECURITYADMIN runs the grants once, or
        # grants one of these roles MANAGE GRANTS.
        continue-on-error: true
        run: uv run deploy/snowflake_admin.py mcp-server

      - name: Reconcile against plain SQL
        run: uv run --with pytest --with snowflake-connector-python --with pyyaml pytest deploy/tests/test_reconcile_semantic_view.py -v
        env:
          RECONCILE_LIVE: "true"

      - name: Build the Qlik metric-definitions table, and export it for sync.py
        run: uv run deploy/snowflake_admin.py qlik-table --write-json target/qlik_metric_definitions.json

      - name: Push master measures to Qlik
        run: uv run deploy/qlik/sync.py --definitions target/qlik_metric_definitions.json
        env:
          QLIK_TENANT_URL: ${{ secrets.QLIK_TENANT_URL }}
          QLIK_API_KEY: ${{ secrets.QLIK_API_KEY }}
          QLIK_APP_ID: ${{ secrets.QLIK_APP_ID }}
